<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1"
    />
    <title>Balatro</title>
    <link rel="stylesheet" type="text/css" href="theme/love.css" />
    <script>
      var newConsole = (function (oldConsole) {
        return {
          log: function () {
            var data = [];
            for (var _i = 0; _i < arguments.length; _i++) {
              data[_i] = arguments[_i];
            }
            if (
              data.length == 1
            ) //Start looking for api's (And dont show anything)
            {
              if (
                typeof data[0] == "string" &&
                data[0].indexOf("callJavascriptFunction") != -1
              ) //Contains function
              {
                // oldConsole.log(data[0]);
                try {
                  return eval(data[0].split("callJavascriptFunction ")[1]);
                } catch (e) {
                  oldConsole.error(
                    "Something went wrong with your callJS: \nCode: " +
                      data[0].split("callJavascriptFunction ")[1] +
                      "\nError: '" +
                      e.message +
                      "'",
                  );
                  return null;
                }
              } else {
                oldConsole.log(data[0]);
                return null;
              }
            } else oldConsole.log(data[0], data.splice(1));
            return null;
          },
          info: function () {
            var data = [];
            for (var _i = 0; _i < arguments.length; _i++) {
              data[_i] = arguments[_i];
            }
            if (data.length == 1) oldConsole.info(data[0]);
            else oldConsole.info(data[0], data.splice(1));
          },
          warn: function () {
            var data = [];
            for (var _i = 0; _i < arguments.length; _i++) {
              data[_i] = arguments[_i];
            }
            if (data.length == 1) oldConsole.warn(data[0]);
            else oldConsole.warn(data[0], data.splice(1));
          },
          error: function () {
            var data = [];
            for (var _i = 0; _i < arguments.length; _i++) {
              data[_i] = arguments[_i];
            }
            if (data.length == 1) oldConsole.error(data[0]);
            else oldConsole.error(data[0], data.splice(1));
          },
          clear: function () {
            oldConsole.clear();
          },
          assert: function () {
            for (var _i = 0; _i < arguments.length; _i++) {
              data[_i] = arguments[_i];
            }
            oldConsole.assert(data[0], data[1], data.splice(2));
          },
          group: function () {
            for (var _i = 0; _i < arguments.length; _i++) {
              data[_i] = arguments[_i];
            }
            oldConsole.group(data[0], data.splice(1));
          },
          groupCollapsed: function () {
            for (var _i = 0; _i < arguments.length; _i++) {
              data[_i] = arguments[_i];
            }
            oldConsole.groupCollapsed(data[0], data.splice(1));
          },
          groupEnd: function () {
            oldConsole.groupEnd();
          },
        };
      })(window.console);
      window.console = newConsole;
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        background: #0b1a24;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        font-family: arial, sans-serif;
      }

      #game-wrapper {
        position: relative;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        overflow: hidden;
      }

      #loadingCanvas,
      #canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      #canvas {
        visibility: hidden;
      }

      #loading-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0d2233;
        pointer-events: none;
      }

      #loading-overlay.hidden {
        display: none;
      }

      #loading-status {
        color: #8ec3e3;
        font-size: 1em;
        letter-spacing: 0.04em;
      }

      #progress-track {
        width: 280px;
        height: 6px;
        background: rgba(142, 195, 227, 0.15);
        border-radius: 3px;
        overflow: hidden;
      }

      #progress-fill {
        height: 100%;
        width: 0%;
        background: #8ec3e3;
        border-radius: 3px;
        transition: width 0.3s ease;
      }

      #mode-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #0d2233;
        z-index: 5;
        color: #d7ecf7;
        text-align: center;
        padding: 24px;
      }

      #mode-overlay.hidden { display: none; }
      #mode-overlay h1 { font-size: 1.6em; letter-spacing: 0.12em; text-transform: uppercase; color: #8ec3e3; }
      #mode-overlay p { max-width: 420px; color: #8aa7b8; line-height: 1.45; }
      .mode-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
      .mode-row button {
        min-width: 160px; padding: 16px 22px; border: 0; border-radius: 10px;
        font: 700 1.05em arial, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
      }
      #mode-vanilla { background: #3d9be8; color: #fff; }
      #mode-paperback {
        background: #8b61ad; color: #fff; text-transform: none;
        letter-spacing: 0.03em; min-width: 240px;
      }
      #mode-bunco {
        background: #d97706; color: #fff; text-transform: none;
        letter-spacing: 0.03em; min-width: 240px;
      }
      #mode-multiplayer { background: #8b5cf6; color: #fff; }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas
        id="loadingCanvas"
        oncontextmenu="event.preventDefault()"
      ></canvas>
      <canvas
        id="canvas"
        oncontextmenu="event.preventDefault()"
        width="100%"
        height="100%"
      ></canvas>

      <div id="mode-overlay">
        <h1>Balatro</h1>
        <p>
          Vanilla is the stock game plus cheats. Paperback and Bunco are
          vanilla+ content packs. Multiplayer mod loads Balatro Multiplayer.
          Each mode keeps a completely separate save.
        </p>
        <div class="mode-row">
          <button id="mode-vanilla" type="button">Vanilla</button>
          <button id="mode-paperback" type="button">
            Paperback (a vanilla+ mod)
          </button>
          <button id="mode-bunco" type="button">
            Bunco (a vanilla+ mod)
          </button>
          <button id="mode-multiplayer" type="button">multiplayer mod</button>
        </div>
      </div>
      <div id="loading-overlay" class="hidden">
        <div id="loading-status">Loading...</div>
        <div id="progress-track">
          <div id="progress-fill"></div>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      window.callad = () => {
        window.parent.postMessage({ type: "adcall" }, "*");
      };

      var canvas = document.getElementById("loadingCanvas");
      canvas.width =
        window.innerWidth ||
        document.documentElement.clientWidth ||
        document.body.clientWidth;
      canvas.height =
        window.innerHeight ||
        document.documentElement.clientHeight ||
        document.body.clientHeight;

      document.getElementById("game-wrapper").style.width = canvas.width + "px";
      document.getElementById("game-wrapper").style.height =
        canvas.height + "px";

      window.onload = function () {
        window.focus();
      };
      window.onclick = function () {
        window.focus();
      };

      window.addEventListener(
        "keydown",
        function (e) {
          if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
            e.preventDefault();
          }
        },
        false,
      );

      var Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: 256000000,
        locateFile: function (path) {
          return path;
        },
        printErr: console.error.bind(console),
        canvas: (function () {
          var c = document.getElementById("canvas");
          c.addEventListener(
            "webglcontextlost",
            function (e) {
              alert("WebGL context lost. You will need to reload the page.");
              e.preventDefault();
            },
            false,
          );
          return c;
        })(),
        setStatus: function (text) {
          var statusEl = document.getElementById("loading-status");
          var overlay = document.getElementById("loading-overlay");

          if (text) {
            statusEl.textContent = text;
          } else if (Module.remainingDependencies === 0) {
            overlay.classList.add("hidden");
            document.getElementById("loadingCanvas").style.display = "none";
            document.getElementById("canvas").style.visibility = "visible";
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function (left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);

          var fill = document.getElementById("progress-fill");
          if (this.totalDependencies > 0) {
            var pct =
              ((this.totalDependencies - left) / this.totalDependencies) * 100;
            fill.style.width = pct + "%";
          }

          Module.setStatus(
            left
              ? "Preparing... (" +
                  (this.totalDependencies - left) +
                  "/" +
                  this.totalDependencies +
                  ")"
              : "All downloads complete.",
          );
        },
      };

      Module.setStatus("Downloading...");

      window.onerror = function () {
        Module.setStatus("Exception thrown, see JavaScript console");
        Module.setStatus = function (text) {
          if (text) Module.printErr("[post-exception status] " + text);
        };
      };

      var applicationLoad = function () {
        Love(Module);
      };
    </script>
    <!-- OCTOPUS_MULTIPLAYER_BOOTSTRAP_START -->
    <script>
      window.OctopusMP = window.OctopusMP || { _pending: [] };
      ["attach", "send"].forEach(function (method) {
        if (typeof window.OctopusMP[method] !== "function") {
          window.OctopusMP[method] = function () {
            this._pending.push([method, Array.from(arguments)]);
          };
        }
      });
    </script>
    <!-- OCTOPUS_MULTIPLAYER_BOOTSTRAP_END -->
    <script>
      (function () {
        var booting = false;
        function loadScript(src, module) {
          return new Promise(function (resolve, reject) {
            var script = document.createElement("script");
            if (module) script.type = "module";
            script.src = src;
            script.onload = resolve;
            script.onerror = function () {
              reject(new Error("failed to load " + src));
            };
            document.head.appendChild(script);
          });
        }
        var hinted = {};
        function hint(rel, href, as, cors) {
          if (!href || hinted[rel + ":" + href]) return;
          hinted[rel + ":" + href] = true;
          var link = document.createElement("link");
          link.rel = rel;
          link.href = href;
          if (as) link.as = as;
          if (cors) link.crossOrigin = "anonymous";
          document.head.appendChild(link);
        }
        var MODES = {
          vanilla: {
            persist: "/home/web_user/love-vanilla",
            dir: "vanilla/",
            multiplayer: false,
          },
          paperback: {
            persist: "/home/web_user/love-paperback",
            dir: "paperback/",
            multiplayer: false,
          },
          bunco: {
            persist: "/home/web_user/love-bunco",
            dir: "bunco/",
            multiplayer: false,
          },
          multiplayer: {
            persist: "/home/web_user/love",
            dir: "",
            multiplayer: true,
          },
        };
        function canonicalMode(mode) {
          if (mode === "modded") return "multiplayer";
          return mode;
        }
        function prefetchMode(mode) {
          mode = canonicalMode(mode);
          var spec = MODES[mode];
          if (!spec) return;
          hint("preload", spec.dir + "game.data", "fetch");
          if (spec.multiplayer) hint("preload", "multiplayer_upstream.js", "script");
        }
        async function start(mode) {
          if (booting) return;
          mode = canonicalMode(mode);
          var spec = MODES[mode];
          if (!spec) throw new Error("unknown launcher mode");
          booting = true;
          window.__octopusMode = mode;
          document.getElementById("mode-overlay").classList.add("hidden");
          document.getElementById("loading-overlay").classList.remove("hidden");
          Module.persistenceDatabase = spec.persist;
          prefetchMode(mode);
          Module.locateFile = function (path) {
            return spec.dir && String(path).indexOf("game.data") === 0
              ? spec.dir + path
              : path;
          };
          var scripts = [];
          if (spec.multiplayer) {
            scripts.push(loadScript("multiplayer_upstream.js", true));
          }
          scripts.push(loadScript(spec.dir + "game.js", false));
          scripts.push(loadScript("love.js", false));
          await Promise.all(scripts);
          applicationLoad();
        }
        window.OctopusLaunch = { start: start, prefetch: prefetchMode };
        hint("preload", "love.js", "script");
        if (typeof fetch === "function") {
          fetch("love.wasm")
            .then(function (response) {
              if (
                !response ||
                !response.ok ||
                typeof response.arrayBuffer !== "function"
              ) {
                return null;
              }
              return response.arrayBuffer();
            })
            .then(function (buffer) {
              if (buffer && !Module.wasmBinary) Module.wasmBinary = buffer;
            })
            .catch(function () {});
        }
        hint("preload", "vanilla/game.js", "script");
        hint("preload", "paperback/game.js", "script");
        hint("preload", "bunco/game.js", "script");
        hint("preload", "game.js", "script");
        ["vanilla", "paperback", "bunco", "multiplayer"].forEach(function (mode) {
          var button = document.getElementById("mode-" + mode);
          if (!button) return;
          button.onclick = function () {
            start(mode);
          };
          button.onmouseenter = function () {
            prefetchMode(mode);
          };
          button.ontouchstart = function () {
            prefetchMode(mode);
          };
        });
        var hash = String(location.hash || "").replace(/^#/, "");
        if (MODES[canonicalMode(hash)]) start(hash);
      })();
    </script>
  </body>
</html>
