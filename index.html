    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        background: #0b1a24;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        font-family: arial, sans-serif;
      }

      #game-wrapper {
        position: relative;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        overflow: hidden;
      }

      #loadingCanvas,
      #canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      #canvas {
        visibility: hidden;
      }

      #loading-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0d2233;
        pointer-events: none;
      }

      #loading-overlay.hidden {
        display: none;
      }

      #loading-status {
        color: #8ec3e3;
        font-size: 1em;
        letter-spacing: 0.04em;
      }

      #progress-track {
        width: 280px;
        height: 6px;
        background: rgba(142, 195, 227, 0.15);
        border-radius: 3px;
        overflow: hidden;
      }

      #progress-fill {
        height: 100%;
        width: 0%;
        background: #8ec3e3;
        border-radius: 3px;
        transition: width 0.3s ease;
      }

      #mode-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #0d2233;
        z-index: 5;
        color: #d7ecf7;
        text-align: center;
        padding: 24px;
      }

      #mode-overlay.hidden {
        display: none;
      }

      #mode-overlay h1 {
        font-size: 1.6em;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8ec3e3;
      }

      #mode-overlay p {
        max-width: 420px;
        color: #8aa7b8;
        line-height: 1.45;
      }

      .mode-row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .mode-row button {
        min-width: 160px;
        padding: 16px 22px;
        border: 0;
        border-radius: 10px;
        font: 700 1.05em arial, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }

      #mode-vanilla {
        background: #3d9be8;
        color: #fff;
      }

      #mode-paperback {
        background: #8b61ad;
        color: #fff;
        text-transform: none;
        letter-spacing: 0.03em;
        min-width: 240px;
      }

      #mode-bunco {
        background: #d97706;
        color: #fff;
        text-transform: none;
        letter-spacing: 0.03em;
        min-width: 240px;
      }

      #mode-pokermon {
        background: #ed533a;
        color: #fff;
        text-transform: none;
        letter-spacing: 0.03em;
        min-width: 240px;
      }

      #mode-multiplayer {
        background: #8b5cf6;
        color: #fff;
      }
    </style>

  <body>
    <div id="game-wrapper">
      <canvas
        id="loadingCanvas"
        oncontextmenu="event.preventDefault()"
      ></canvas>
      <canvas
        id="canvas"
        oncontextmenu="event.preventDefault()"
        width="100%"
        height="100%"
      ></canvas>

      <div id="mode-overlay">
        <h1>Balatro</h1>
        <p>
          Vanilla is the stock game plus cheats. Paperback and Bunco
          are vanilla+ content packs. Multiplayer mod loads Balatro Multiplayer.
          Each mode keeps a completely separate save.
        </p>
        <div class="mode-row">
          <button id="mode-vanilla" type="button">Vanilla</button>
          <button id="mode-paperback" type="button">
            Paperback (a vanilla+ mod)
          </button>
          <button id="mode-bunco" type="button">
            Bunco (a vanilla+ mod)
          </button>
          <button id="mode-multiplayer" type="button">multiplayer mod</button>
        </div>
      </div>
      <div id="loading-overlay" class="hidden">
        <div id="loading-status">Loading...</div>
        <div id="progress-track">
          <div id="progress-fill"></div>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      window.callad = () => {
        window.parent.postMessage({ type: "adcall" }, "*");
      };

      // index.html is also a downloadable launcher. Keep the heavy runtime in
      // the repository so a lone local copy does not look for 15 MB of missing
      // files beside itself.
      // Set by the runtime loader below after it resolves main to one exact
      // commit. Every engine/package request must use the same immutable ref.
      var REMOTE_ASSET_BASE = "";

      var canvas = document.getElementById("loadingCanvas");
      canvas.width =
        window.innerWidth ||
        document.documentElement.clientWidth ||
        document.body.clientWidth;
      canvas.height =
        window.innerHeight ||
        document.documentElement.clientHeight ||
        document.body.clientHeight;

      document.getElementById("game-wrapper").style.width = canvas.width + "px";
      document.getElementById("game-wrapper").style.height =
        canvas.height + "px";

      window.onload = function () {
        window.focus();
      };
      window.onclick = function () {
        window.focus();
      };

      window.addEventListener(
        "keydown",
        function (e) {
          if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
            e.preventDefault();
          }
        },
        false,
      );

      var Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: 256000000,
        locateFile: function (path) {
          return REMOTE_ASSET_BASE + path;
        },
        printErr: console.error.bind(console),
        canvas: (function () {
          var c = document.getElementById("canvas");
          c.addEventListener(
            "webglcontextlost",
            function (e) {
              alert("WebGL context lost. You will need to reload the page.");
              e.preventDefault();
            },
            false,
          );
          return c;
        })(),
        setStatus: function (text) {
          var statusEl = document.getElementById("loading-status");
          var overlay = document.getElementById("loading-overlay");

          if (text) {
            statusEl.textContent = text;
          } else if (Module.remainingDependencies === 0) {
            overlay.classList.add("hidden");
            document.getElementById("loadingCanvas").style.display = "none";
            document.getElementById("canvas").style.visibility = "visible";
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function (left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);

          var fill = document.getElementById("progress-fill");
          if (this.totalDependencies > 0) {
            var pct =
              ((this.totalDependencies - left) / this.totalDependencies) * 100;
            fill.style.width = pct + "%";
          }

          Module.setStatus(
            left
              ? "Preparing... (" +
                  (this.totalDependencies - left) +
                  "/" +
                  this.totalDependencies +
                  ")"
              : "All downloads complete.",
          );
        },
      };

      Module.setStatus("Downloading...");

      window.onerror = function () {
        Module.setStatus("Exception thrown, see JavaScript console");
        Module.setStatus = function (text) {
          if (text) Module.printErr("[post-exception status] " + text);
        };
      };

      var applicationLoad = function () {
        Love(Module);
      };
    </script>

    <script>
      (function () {
        "use strict";

        var REPOSITORY = "bitball41/octopus-oatmeal";
        var MAIN_COMMIT_API =
          "https://api.github.com/repos/" + REPOSITORY + "/commits/main";

        var FALLBACK_RUNTIME_REF =
          "ef74520f7ee7d1321b21fbff68cb2d5b1b2e81fa";
        var booting = false;
        var wasmReady = Promise.resolve();
        var hinted = {};

var ASSET_REVISIONS = {"bunco/game.js": "c5205ecc3c7f21a688f1e292e27ced1b11d2f163dc045d08e3fc9d8301d435a5", "game.js": "21345d4b7fac95c01b684a77cf2feeabc8ff4ef868a1417ba9099bfcddb4387a", "love.js": "d9ef38a8a175fc9081da434b228a41866e947d9a9b8ee5eb3c8523b66f94fb8b", "love.wasm": "ecc9e098bb8af918d20fbe3f26d23495c5184ff6b5d203d2e4b27bf17a771d6f", "multiplayer_upstream.js": "b02a6913c37b3b7537b715772401a24786df6cef4f2db79ce3befeee2ed00510", "paperback/game.js": "5e1824eef7c3f4c62870894881efec934639c3f9c5e3adb7c0446ee9bfed948f", "pokermon/game.js": "4c2fc7d99137b669be04989136a41004706b8f338687fe183e0201ce92916ff3", "vanilla/game.js": "58019520ce613b56d49decc7d1d1c161cf5aa7e7033352f50058275ab9f9914d"};

        async function loadScript(src, module) {
          var original = src;
          src = await cachedScriptURL(src);
          return new Promise(function (resolve, reject) {
            var script = document.createElement("script");
            if (module) script.type = "module";
            script.src = src;

          if (mode === "modded") return "multiplayer";
          return mode;

        function bindMode(id, mode) {
          var button = document.getElementById(id);
          if (!button) return;
          button.onclick = function () {
            start(mode);
          };
          button.onmouseenter = function () {
            prefetchMode(mode);
          };
          button.ontouchstart = function () {
            prefetchMode(mode);

          var assetBase = "";

            runtimeRef = "local";

            try {
              runtimeRef = await resolveRuntimeRef();

            wasmReady = cachedAsset(wasmHref)

                  !response ||

                  typeof response.arrayBuffer !== "function"

                return response.arrayBuffer();

              .then(function (buffer) {

          hint("preload", assetBase + "paperback/game.js", "script");
          hint("preload", assetBase + "bunco/game.js", "script");
          hint("preload", assetBase + "pokermon/game.js", "script");
          hint("preload", assetBase + "game.js", "script");
          return { runtimeRef: runtimeRef, assetBase: assetBase };
        }

        var warmupPromise = warmup();

        function prefetchMode(mode) {
          // Downloads begin on Play, after checking the persistent mode cache.
        }

        async function start(mode) {
          if (booting) return;
          mode = canonicalMode(mode);
          var spec = MODES[mode];
          if (!spec) {
            throw new Error("unknown launcher mode");
          }
          booting = true;
          window.__octopusMode = mode;
          var picker = document.getElementById("mode-overlay");
          var loading = document.getElementById("loading-overlay");
          if (picker) picker.classList.add("hidden");
          if (loading) loading.classList.remove("hidden");

          Module.persistenceDatabase = spec.persist;
          if (spec.memory) Module.INITIAL_MEMORY = spec.memory;
          Module.setStatus("Resolving current build...");
          prefetchMode(mode);

          var warmed = await warmupPromise;
          var runtimeRef = warmed.runtimeRef;
          var assetBase = warmed.assetBase;

          REMOTE_ASSET_BASE = assetBase;
          window.__octopusRuntimeRef = runtimeRef;

            var mapped =
              spec.dir && String(path).indexOf("game.data") === 0

            // GitHub raw remains the manual fallback if a pack ever blows it.
            return assetBase + mapped;

            var scripts = [];
            if (spec.multiplayer) {
              scripts.push(
                loadScript(assetBase + "multiplayer_upstream.js", true),

            }
            scripts.push(loadScript(assetBase + spec.dir + "game.js", false));
            scripts.push(loadScript(assetBase + "love.js", false));
