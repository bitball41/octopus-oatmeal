    <style>
      * {

        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        background: #0b1a24;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        font-family: arial, sans-serif;
      }

      #game-wrapper {
        position: relative;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        overflow: hidden;
      }

      #loadingCanvas,

        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;

      }

        visibility: hidden;

        position: absolute;
        inset: 0;

        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0d2233;
        pointer-events: none;

        display: none;
      }

        color: #8ec3e3;
        font-size: 1em;
        letter-spacing: 0.04em;
      }

      #progress-track {
        width: 280px;
        height: 6px;
        background: rgba(142, 195, 227, 0.15);
        border-radius: 3px;
        overflow: hidden;
      }

      #progress-fill {
        height: 100%;
        width: 0%;
        background: #8ec3e3;
        border-radius: 3px;
        transition: width 0.3s ease;

        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        color: #d7ecf7;
        text-align: center;

        display: none;

      #mode-overlay h1 {
        font-size: 1.6em;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8ec3e3;
      }

        max-width: 420px;
        color: #8aa7b8;
        line-height: 1.45;

        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;

        min-width: 160px;
        padding: 16px 22px;
        border: 0;
        border-radius: 10px;
        font: 700 1.05em arial, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;

        background: #3d9be8;
        color: #fff;

        background: #8b61ad;
        color: #fff;

        background: #d97706;
        color: #fff;

  <body>
    <div id="game-wrapper">
      <canvas
        id="loadingCanvas"
        oncontextmenu="event.preventDefault()"
      ></canvas>
      <canvas
        id="canvas"
        oncontextmenu="event.preventDefault()"
        width="100%"
        height="100%"
      ></canvas>

      <div id="mode-overlay">
        <h1>Balatro</h1>
        <div class="mode-row" aria-label="Original game">
          <button id="mode-vanilla" type="button" data-tip="vanilla">Vanilla</button>
        </div>
        <div class="mode-row" aria-label="Featured modes">
          <button id="mode-handy" type="button" data-tip="handy">Vanilla + Handy</button>
          <button id="mode-cryptid" type="button" data-tip="cryptid">Cryptid</button>
          <button id="mode-entropy" type="button" data-tip="entropy">Entropy</button>
          <button id="mode-fish" type="button" data-tip="fish">Fish &amp; Chips</button>
        </div>
        <div class="mode-row" aria-label="More mods">
          <button id="mode-paperback" type="button" data-tip="paperback">Paperback</button>
          <button id="mode-bunco" type="button" data-tip="bunco">Bunco</button>
          <button id="mode-multiplayer" type="button" data-tip="multiplayer">Multiplayer</button>
          <button id="mode-sleeves" type="button" data-tip="sleeves">CardSleeves</button>
          <button id="mode-randomizer" type="button" data-tip="randomizer">Custom Randomizer</button>
        </div>
        <div class="mode-row">
          <button id="mode-custom" type="button" aria-expanded="false" aria-controls="build-panel" data-tip="custom">Custom Build</button>
        </div>
        <section id="build-panel" hidden aria-labelledby="build-heading">
          <h2 id="build-heading">Custom Build</h2>
          <div class="build-options">
            <label class="build-option" data-tip="handy"><input type="checkbox" value="handy"> Handy</label>
            <label class="build-option" data-tip="cryptid"><input type="checkbox" value="cryptid"> Cryptid</label>
            <label class="build-option" data-tip="paperback"><input type="checkbox" value="paperback"> Paperback</label>
            <label class="build-option" data-tip="bunco"><input type="checkbox" value="bunco"> Bunco</label>
            <label class="build-option" data-tip="multiplayer"><input type="checkbox" value="multiplayer"> Multiplayer</label>
            <label class="build-option" data-tip="sleeves"><input type="checkbox" value="sleeves"> CardSleeves</label>
            <label class="build-option" data-tip="randomizer"><input type="checkbox" value="randomizer"> Randomizer</label>
          </div>
          <div id="randomizer-range" hidden>
            <label>Minimum scoring multiplier (×)<input id="randomizer-min" type="number" min="0" max="1000000" step="any" value="0.1"></label>
            <label>Maximum scoring multiplier (×)<input id="randomizer-max" type="number" min="0" max="1000000" step="any" value="10"></label>
            <p style="flex-basis:100%;margin:0;color:#b0ccdd;font-size:13px">Usually near 1×; extreme rolls are rare. Prices, odds and counts vary gently. Your deck’s starting limits and the ante curve stay intact.</p>
          </div>
          <div id="build-actions"><div id="build-summary" aria-live="polite">Select two or more mods.</div><button id="launch-build" type="button">Launch Build</button></div>
          <div id="build-error" role="alert"></div>
        </section>
        <div id="mode-tooltip" role="tooltip" hidden></div>
      </div>
      <div id="loading-overlay" class="hidden">
        <div id="loading-status">Loading...</div>
        <div id="progress-track">
          <div id="progress-fill"></div>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      window.callad = () => {
        window.parent.postMessage({ type: "adcall" }, "*");
      };

      // index.html is also a downloadable launcher. Keep the heavy runtime in
      // the repository so a lone local copy does not look for 15 MB of missing
      // files beside itself.
      // Set by the runtime loader below after it resolves main to one exact
      // commit. Every engine/package request must use the same immutable ref.
      var REMOTE_ASSET_BASE = "";

      var canvas = document.getElementById("loadingCanvas");
      canvas.width =
        window.innerWidth ||
        document.documentElement.clientWidth ||
        document.body.clientWidth;
      canvas.height =
        window.innerHeight ||
        document.documentElement.clientHeight ||
        document.body.clientHeight;

      document.getElementById("game-wrapper").style.width = canvas.width + "px";
      document.getElementById("game-wrapper").style.height =
        canvas.height + "px";

      window.onload = function () {
        window.focus();
      };
      window.onclick = function () {
        window.focus();
      };

      window.addEventListener(
        "keydown",
        function (e) {
          if (e.target && /^(INPUT|TEXTAREA|BUTTON|SELECT)$/.test(e.target.tagName)) return;
          if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
            e.preventDefault();
          }
        },
        false,
      );

      var Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: 256000000,
        locateFile: function (path) {
          return REMOTE_ASSET_BASE + path;
        },
        printErr: console.error.bind(console),
        canvas: (function () {
          var c = document.getElementById("canvas");
          c.addEventListener(
            "webglcontextlost",
            function (e) {
              alert("WebGL context lost. You will need to reload the page.");
              e.preventDefault();
            },
            false,
          );
          return c;
        })(),
        setStatus: function (text) {
          var statusEl = document.getElementById("loading-status");
          var overlay = document.getElementById("loading-overlay");

          if (text) {
            statusEl.textContent = text;
          } else if (Module.remainingDependencies === 0) {
            overlay.classList.add("hidden");
            document.getElementById("loadingCanvas").style.display = "none";
            document.getElementById("canvas").style.visibility = "visible";
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function (left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);

          var fill = document.getElementById("progress-fill");
          if (this.totalDependencies > 0) {
            var pct =
              ((this.totalDependencies - left) / this.totalDependencies) * 100;
            fill.style.width = pct + "%";
          }

          Module.setStatus(
            left
              ? "Preparing... (" +
                  (this.totalDependencies - left) +
                  "/" +
                  this.totalDependencies +
                  ")"
              : "All downloads complete.",
          );
        },
      };

      Module.setStatus("Downloading...");

      window.onerror = function () {
        Module.setStatus("Exception thrown, see JavaScript console");
        Module.setStatus = function (text) {
          if (text) Module.printErr("[post-exception status] " + text);
        };
      };

      var applicationLoad = function () {
        Love(Module);
      };
    </script>

          hint("preload", assetBase + "pokermon/game.js", "script");
          hint("preload", assetBase + "game.js", "script");
