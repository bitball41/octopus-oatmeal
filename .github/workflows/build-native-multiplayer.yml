name: Build native multiplayer artifacts

on:
  push:
    branches:
      - fix/upstream-multiplayer-native-menu

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[built-artifacts]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct pinned upstream archives
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, tempfile, zipfile
          from pathlib import Path

          root = Path.cwd()
          lock_path = root / 'vendor' / 'upstream.json'
          lock = json.loads(lock_path.read_text())
          with tempfile.TemporaryDirectory() as temporary:
              temporary = Path(temporary)
              for name, spec in lock.items():
                  checkout = temporary / name
                  subprocess.run(['git', 'clone', '--filter=blob:none', '--no-checkout', spec['url'], checkout], check=True)
                  subprocess.run(['git', '-C', checkout, 'checkout', '--detach', spec['commit']], check=True)
                  paths = subprocess.check_output(['git', '-C', checkout, 'ls-files', '-z']).split(b'\0')
                  archive = root / 'vendor' / spec['archive']
                  with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as output:
                      for raw_path in sorted(path for path in paths if path):
                          path = raw_path.decode()
                          info = zipfile.ZipInfo(path, (2026, 1, 1, 0, 0, 0))
                          info.compress_type = zipfile.ZIP_DEFLATED
                          output.writestr(info, (checkout / path).read_bytes())
                  spec['sha256'] = hashlib.sha256(archive.read_bytes()).hexdigest()
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')
          PY
      - run: npm ci
      - run: npm run build:multiplayer
      - run: npm run test:loader
      - name: Commit release artifacts
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/build-native-multiplayer.yml
          git add game.data game.js multiplayer_upstream.js vendor
          git commit -m "Build native multiplayer release artifacts [built-artifacts]"
          git push
