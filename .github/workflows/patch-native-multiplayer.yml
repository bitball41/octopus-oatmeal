name: Build native browser multiplayer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-multiplayer-menu
      - hotfix/legacy-launcher-native-mp
      - fix/native-menu-text-input
      - fix/native-multiplayer-button
      - fix/native-multiplayer-render-v2
    paths:
      - octopus_multiplayer.lua
      - multiplayer.js
      - multiplayer_native.js
      - scripts/patch_multiplayer.py
      - scripts/patch_multiplayer_html.py
      - scripts/validate_native_menu.py
      - .github/workflows/patch-native-multiplayer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Validate browser client syntax
        run: |
          node --check multiplayer.js
          node --check multiplayer_native.js

      - name: Validate Lua syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          python3 -m pip install --quiet lupa
          luac -p octopus_multiplayer.lua

      - name: Patch game archive
        run: python3 scripts/patch_multiplayer.py

      - name: Exercise packed native menu and callbacks
        run: python3 scripts/validate_native_menu.py

      - name: Patch HTML entry points
        run: python3 scripts/patch_multiplayer_html.py

      - name: Validate HTML patch is idempotent
        run: |
          cp balatro.html /tmp/balatro.once.html
          cp index.html /tmp/index.once.html
          python3 scripts/patch_multiplayer_html.py
          cmp balatro.html /tmp/balatro.once.html
          cmp index.html /tmp/index.once.html

      - name: Validate archive
        run: |
          python3 - <<'PY'
          import zipfile

          z = zipfile.ZipFile('game.data')
          names = set(z.namelist())
          required = {
              'octopus_multiplayer.lua',
              'main.lua',
              'game.lua',
              'functions/state_events.lua',
              'functions/button_callbacks.lua',
              'functions/UI_definitions.lua',
          }
          missing = required - names
          if missing:
              raise SystemExit(f'missing patched files: {sorted(missing)}')

          main = z.read('main.lua').decode('utf-8')
          game = z.read('game.lua').decode('utf-8')
          state = z.read('functions/state_events.lua').decode('utf-8')
          buttons = z.read('functions/button_callbacks.lua').decode('utf-8')
          ui = z.read('functions/UI_definitions.lua').decode('utf-8')
          mp = z.read('octopus_multiplayer.lua').decode('utf-8')

          checks = [
              ('loader', 'require("octopus_multiplayer")' in main),
              ('callbacks installed before love.run', main.index('OCTOPUS_MP.install_callbacks()') < main.index('function love.run()')),
              ('callbacks installed after Balatro callback table', main.index('require "functions/button_callbacks"') < main.index('OCTOPUS_MP.install_callbacks()')),
              ('browser textinput callback', 'function love.textinput(text)' in main),
              ('textinput forwards to Balatro editor', 'G.FUNCS.text_input_key({' in main),
              ('update hook', 'OCTOPUS_MP.update(dt)' in game),
              ('round hook', 'OCTOPUS_MP.should_end_round()' in game),
              ('score hook', 'OCTOPUS_MP.on_hand_scored(hand_chips*mult)' in state),
              ('blind-end hook', 'OCTOPUS_MP.on_round_end(game_over)' in state),
              ('run-start hook', 'OCTOPUS_MP.on_run_start()' in buttons),
              ('native main-menu panel', 'octopus_native_main_menu' in ui),
              ('native main-menu button', 'octopus_multiplayer_button' in ui),
              ('single visible main-menu row', 'octopus_multiplayer_row' not in ui),
              ('old inline button removed', ui.count('octopus_multiplayer_button') == 1),
              ('native multiplayer overlay', 'create_UIBox_octopus_multiplayer' in mp),
          ]
          failed = [name for name, ok in checks if not ok]
          if failed:
              raise SystemExit(f'patch validation failed: {failed}')
          print('native multiplayer menu, callback load order, and browser text input archive validation passed')
          PY

      - name: Validate HTML bridge
        run: |
          grep -q 'multiplayer_native.js' balatro.html
          grep -q 'octopus-oatmeal@main/multiplayer_native.js?v=native-menu-20260904-2' index.html
          test "$(grep -o 'multiplayer_native.js' balatro.html | wc -l)" -eq 1
          test "$(grep -o 'multiplayer_native.js' index.html | wc -l)" -eq 1
          if grep -q 'id="octo-mp-toggle"' balatro.html index.html; then
            echo 'old floating multiplayer UI still present'
            exit 1
          fi

      - name: Commit generated build
        run: |
          if git diff --quiet -- game.data game.js balatro.html index.html; then
            echo "Generated build already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.data game.js balatro.html index.html
          git commit -m "Build deterministic native multiplayer menu"
          git push origin HEAD:${{ github.ref_name }}
