name: Build Cryptid, Entropy and Handy browser modes

on:
  workflow_dispatch:
  push:
    branches: [main, feat/custom-mod-builds]
    paths:
      - '.github/workflows/build-cryptid.yml'
      - 'scripts/cryptid_browser.py'
      - 'scripts/entropy_browser.py'
      - 'scripts/validate_new_mods.py'
      - 'scripts/validate_new_mods_browser.mjs'
      - 'scripts/prepare_mod_smoke.py'
      - 'scripts/probes/**'
      - 'browser/lua/browser/vanilla_stacks.lua'
      - 'scripts/compile_cryptid_lua.mjs'
      - 'scripts/validate_cryptid.py'
      - 'scripts/validate_handy.py'
      - 'scripts/validate_handy_boot.py'
      - 'scripts/handy_browser.py'
      - 'scripts/install_handy_launcher.py'
      - 'scripts/validate_vanilla_handy.py'
      - 'scripts/build_upstream.py'
      - 'scripts/patch_multiplayer.py'
      - 'scripts/patch_multiplayer_html.py'
      - 'scripts/fetch_cryptid_sources.py'
      - 'scripts/install_cryptid_launcher.py'
      - 'browser/lua/browser/bignum_compare.lua'
      - 'browser/lua/browser/handy.lua'
      - 'browser/lua/browser/handy_platform.lua'
      - 'vendor/upstream.json'
      - 'browser/custom-runtime.js'
      - 'browser/mod-selector.js'
      - 'browser/value-randomizer.lua'
      - 'browser/bridge.js'
      - 'scripts/build_custom.py'
      - 'scripts/bundle_custom.mjs'
      - 'scripts/combo_compatibility.py'
      - 'scripts/randomize_literals.mjs'
      - 'scripts/install_mod_selector.py'

permissions:
  contents: write

concurrency:
  group: cryptid-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools and verify pinned sources
        run: |
          npm ci
          python -m pip install pillow lupa
          python scripts/fetch_cryptid_sources.py
      - name: Restore compiled mod cache
        uses: actions/cache@v4
        with:
          path: |
            custom
            build/comparison-cache
            build/pack-cache
          key: custom-mods-v1-${{ runner.os }}-${{ hashFiles('scripts/*.py', 'scripts/compile_cryptid_lua.mjs', 'scripts/randomize_literals.mjs', 'browser/lua/**/*.lua', 'browser/value-randomizer.lua', 'vendor/upstream.json') }}
          restore-keys: custom-mods-v1-${{ runner.os }}-
      - name: Build and verify existing Cryptid and Handy presets
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import build_upstream as b
          b.build_vanilla((b.ROOT/'game.js').read_text(), release=True)
          PY
          npm run build:handy
          npm run test:handy
          npm run build:cryptid
          npm run test:cryptid
          npm run build:entropy
          npm run test:new-mods
          node scripts/build_server.mjs
      - name: Exercise Entropy and QoL in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:new-mods-browser
      - name: Compile all 64 custom mod combinations
        run: npm run build:custom
      - name: Verify packages, multiplayer and save compatibility
        run: |
          npm run test:custom
          npm run test:sessions -- game.data
          npm run test:loader
          python scripts/validate_modes.py
      - name: Commit runtime assets and pin the launcher fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entropy vanilla vendor/Entropy.zip vendor/Spectrallib.zip vendor/JokerDisplay.zip vendor/Overflow.zip custom custom-runtime.js multiplayer_upstream.js cryptid vanilla-handy vendor/CardSleeves.zip vendor/Cryptid.zip vendor/Amulet.zip vendor/SteamoddedCryptid.zip vendor/Handy.zip index.html balatro.html
          if ! git diff --cached --quiet; then
            git commit -m "Build pinned Cryptid and Vanilla Handy runtimes"
          fi
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          Path('runtime.json').write_text(json.dumps({'sha':sha})+'\n')
          for name in ('index.html','balatro.html'):
              p = Path(name)
              p.write_text(re.sub(r'(var FALLBACK_RUNTIME_REF\s*=\s*)"[0-9a-f]{40}"', lambda m:m[1]+'"'+sha+'"', p.read_text()))
          PY
          git add index.html balatro.html runtime.json
          if ! git diff --cached --quiet; then
            git commit -m "Pin launcher fallback to the Cryptid runtime"
          fi
          git push origin HEAD:${{ github.ref_name }}
