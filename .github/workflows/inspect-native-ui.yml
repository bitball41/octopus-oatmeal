name: Inspect native Balatro UI hooks

on:
  push:
    branches:
      - feature/native-multiplayer-menu
    paths:
      - scripts/inspect_native_ui.py
      - .github/workflows/inspect-native-ui.yml
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-multiplayer-menu
      - name: Print native UI hook context
        run: python3 scripts/inspect_native_ui.py
      # global text-input probe
