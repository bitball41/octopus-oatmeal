name: Reproduce Handy and Cryptid multiplayer startup
on:
  push:
    branches: [fix/handy-and-cryptid-mp]
concurrency:
  group: startup-browser-probe
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm install --no-save playwright@1.51.1 && npx playwright install --with-deps chromium
      - run: node scripts/probe_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-startup-diagnostics
          path: |
            *-browser.log
            *-boot.png
            custom-start.png
