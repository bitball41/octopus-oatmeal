name: Reproduce Handy and Cryptid multiplayer startup
on:
  push:
    branches: [fix/handy-and-cryptid-mp]
concurrency:
  group: startup-browser-probe
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm install --no-save playwright@1.51.1 && npx playwright install --with-deps chromium
      - run: python -m pip install lupa && python scripts/repack_multiplayer_start.py && python scripts/validate_multiplayer_start.py && python scripts/patch_multiplayer_html.py
      - run: node scripts/probe_two_players.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-startup-diagnostics
          path: |
            *-browser.log
            *-boot.png
            custom-start.png
            *-run.png
      - name: Save verified startup runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.data game.js custom index.html balatro.html
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild verified multiplayer startup cleanup"
            git push origin HEAD:fix/handy-and-cryptid-mp
          fi
